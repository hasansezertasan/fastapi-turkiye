---
name: Deploy Docs
on:
  workflow_dispatch:  # Allows manual triggering of the workflow
  push:
    branches: ["main"]  # Triggers on pushes to the main branch
    paths-ignore:
      - ".github/**"  # Ignores changes in the .github directory
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}  # Grouping by workflow name and reference
  cancel-in-progress: true  # Cancel any in-progress runs for the same group
permissions:
  contents: write  # Required for pushing changes to the repository
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Step 1: Check out the repository
      # Description: Checks out the repository so that the workflow can access its contents.
      # Credentials stay persisted because `mkdocs gh-deploy` pushes to gh-pages with them.
      - name: Checkout repository  # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Step 2: Install mise using the specified action
      # Description: Installs mise, a tool for building and deploying documentation, along
      # with the tools defined in the .config/mise.toml file.
      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5
      # Step 3: Build and deploy the documentation
      # Description: Builds the documentation using mkdocs (run through uv) and pushes it to
      # the gh-pages branch. --locked fails the build if uv.lock is out of sync with
      # pyproject.toml, so deploys always use the committed, reviewed lockfile rather than a
      # fresh CI resolution. --no-dev skips the lint tools, which the deploy does not need.
      - name: Build and deploy docs
        run: uv run --locked --no-dev mkdocs gh-deploy --force
