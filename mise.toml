[tools]
uv = "0.13.0"
actionlint = "1.7.12"
action-validator = "0.9.0"
markdownlint-cli2 = "0.17.2"
yamlfmt = "0.21.0"
typos = "1.51.1"
yamllint = "1.38.0"
pre-commit = "4.1.0"
taplo = "0.10.0"

[tasks."style:lint"]
description = "Linting"
run = """
mise exec yamllint -- yamllint -c .config/.yamllint.yaml .
mise exec actionlint -- actionlint
mise exec action-validator -- action-validator
mise exec markdownlint-cli2 -- markdownlint-cli2 --config .config/.markdownlint-cli2.jsonc .
mise exec taplo -- taplo lint pyproject.toml
mise exec typos -- typos --config .config/_typos.toml .
"""

[tasks."style:format"]
description = "Run the formatters"
run = """
mise exec yamlfmt -- yamlfmt -conf .config/.yamlfmt.yml .
mise exec taplo -- taplo format .
"""

[tasks."docs:serve"]
description = "Serving Docs"
run = "uv run mkdocs serve"

[tasks."docs:build"]
description = "Building Docs"
depends = ["style:lint", "style:format"]
run = "uv run mkdocs build --clean"
