[project]
name = "fastapi-turkiye"
version = "0.0.0"
description = "Turkish translation of the FastAPI documentation."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "mkdocs[i18n]>=1.6.1",
  "mkdocs-material>=9.7.6",
  "mkdocs-markdownextradata-plugin>=0.2.6",
  "pyyaml>=6.0.3",
]

[dependency-groups]
# Lint tools used by prek hooks. `uv run` installs this group by default; the
# docs deploy skips it with `--no-dev`.
dev = [
  "detect-secrets>=1.5.0",
  "editorconfig-checker>=3.11.1",
]

[tool.typos.default.extend-words]
metod = "metod"
bu = "bu"
